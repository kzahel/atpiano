[project]
name = "atpiano"
version = "0.1.0"
description = "Acoustic-piano transcription research harness"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "alembic>=1.16,<2",
  "basic-pitch==0.4.0",
  "fastapi>=0.116,<1",
  "mido>=1.3,<2",
  "numpy>=1.26,<2",
  "partitura==1.9.0",
  "pretty-midi>=0.2.10,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.12,<3",
  "scikit-learn>=1.5,<1.5.2",
  "scipy>=1.12,<2",
  "setuptools>=75,<81",
  "soundfile>=0.12,<1",
  "sqlalchemy>=2.0.41,<2.1",
  "uvicorn>=0.35,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
capture = [
  "sounddevice>=0.5,<1",
]
corrected = [
  "transkun==2.0.1",
]

[project.scripts]
atpiano = "atpiano.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atpiano"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
