[package]
name = "atpiano-desktop"
version = "0.1.0"
description = "Thin native supervisor for the Atpiano local engine"
authors = ["Atpiano contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "atpiano_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fs2 = "0.4.3"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
base64 = "0.22.1"
minisign-verify = "0.2.5"
tempfile = "3.21.0"

# Keep routine dev and test builds small while retaining file/line backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Opt into full source-level debugger data in an isolated output directory.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = "full"
